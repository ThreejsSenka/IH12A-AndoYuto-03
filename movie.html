<body class="page-movie">

<div id="container">

    <site-header></site-header>

    <!-- Breadcrumb -->
    <div class="breadcrumb">
      <a href="index.html"><i data-lucide="home" style="width: 14px; height: 14px;"></i> トップ</a>
      <span class="sep">/</span>
      <span class="current">ムービー</span>
    </div>

    <!-- Main Content -->
    <main class="main movie-main">

      <section class="movie-section">
        
        <div class="section-title ">
          <h2>ムービー</h2>
          <h3>レ・クリエイションＯＰ</h3>
        </div>

        <!-- 動画プレイヤー -->
        <div class="jumbotron-container">
          <!-- リギング装飾 -->
          <div class="jumbotron-rigging">
            <div class="rigging-cable cable-left"></div>
            <div class="rigging-cable cable-center-left"></div>
            <div class="rigging-cable cable-center-right"></div>
            <div class="rigging-cable cable-right"></div>
            <div class="rigging-truss-bar"></div>
          </div>

          <!-- ビジョンフレーム -->
          <div class="jumbotron-frame">
            <!-- ステータスバー -->
            <div class="jumbotron-top-bar">
              <div class="vision-status">
                <span class="status-indicator-dot"></span>
                <span class="vision-id">ARENA CENTER-HUNG JUMBOTRON // FEED-01</span>
              </div>
              <div class="vision-meta">
                <span class="meta-tag">DIRECT FEED</span>
              </div>
            </div>

            <!-- スクリーンエリア -->
            <div class="jumbotron-screen-wrap" id="jumbotronScreen">
              <!-- 動画 -->
              <video id="arenaVideoPlayer" src="./movie/op-movie.mp4" playsinline preload="metadata"></video>

              <!-- 再生ボタン -->
              <button class="center-play-btn" id="centerPlayBtn" aria-label="再生">
                <i data-lucide="play"></i>
              </button>

              <!-- コントローラー -->
              <div class="jumbotron-controls" id="jumbotronControls">
                <!-- プログレスシークバー -->
                <div class="controls-timeline-wrap" id="timelineWrap">
                  <div class="timeline-bar" id="timelineBar">
                    <div class="timeline-buffered" id="timelineBuffered"></div>
                    <div class="timeline-progress" id="timelineProgress"></div>
                  </div>
                </div>

                <div class="controls-bar">
                  <!-- 再生情報 -->
                  <div class="controls-left">
                    <button class="ctrl-btn" id="playPauseBtn" aria-label="再生/一時停止">
                      <i data-lucide="play" id="playIcon"></i>
                    </button>
                    <div class="time-display">
                      <span id="currentTime">0:00</span> <span class="time-sep">/</span> <span id="durationTime">0:00</span>
                    </div>
                  </div>

                  <!-- コントロールボタン -->
                  <div class="controls-right">
                    <div class="volume-wrap">
                      <button class="ctrl-btn" id="volumeBtn" aria-label="ミュート切替">
                        <i data-lucide="volume-2" id="volumeIcon"></i>
                      </button>
                      <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="1" aria-label="音量調節">
                    </div>
                    <button class="ctrl-btn" id="fullscreenBtn" aria-label="全画面表示">
                      <i data-lucide="maximize" id="fullscreenIcon"></i>
                    </button>
                  </div>
                </div>
              </div>
            </div>

            <!-- コーナー装飾 -->
            <div class="corner-bracket corner-tl"></div>
            <div class="corner-bracket corner-tr"></div>
            <div class="corner-bracket corner-bl"></div>
            <div class="corner-bracket corner-br"></div>
          </div>

          <!-- ビジョン下部のアリーナ床面アンビエント反射グロー -->
          <div class="jumbotron-ambient-glow" id="jumbotronAmbientGlow"></div>
        </div>
      </section>

    </main>

    <site-footer></site-footer>

  </div> <!--container-->
